[package]
name = "linguaflow"
version = "0.1.0"
description = "Linguaflow - AI accent training"
authors = ["Linguaflow"]
edition = "2021"

[lib]
name = "linguaflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2.1", features = [] }
log = "0.4"

[features]
custom-protocol = ["tauri/custom-protocol"]
