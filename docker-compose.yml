# Linguaflow self-hosted backend.
#
#   1. cp .env.example .env   — fill in keys; set API_DOMAIN to your domain
#   2. docker compose up -d --build
#   3. Point a Cloudflare-proxied A record at this VPS; HTTPS terminates at CF.
#
# The API container reads the same .env the SST deploy uses — no extra config.

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      PORT: "3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${NGINX_PORT:-80}:80"
    environment:
      API_DOMAIN: ${API_DOMAIN:-_}
    volumes:
      - ./deploy/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
